[project]
name = "spyno-service"
version = "0.1.0"
description = "Serviço de decisão para notificações adaptativas do Spyno"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "sqlalchemy>=2.0",
    "numpy>=1.26",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
# A política PPO puxa torch. Fica opcional para que o serviço suba sem ela.
ppo = ["stable-baselines3>=2.8", "gymnasium>=1.0"]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spyno_service"]
