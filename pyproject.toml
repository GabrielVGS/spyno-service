[project]
name = "spyno-service"
version = "0.1.0"
description = "Serviço de decisão para notificações adaptativas do Spyno"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "sqlalchemy>=2.0",
    "numpy>=1.26",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
# A política PPO puxa torch. Fica opcional para que o serviço suba sem ela.
ppo = ["stable-baselines3>=2.8", "gymnasium>=1.0"]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spyno_service", "spyno_decision"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Conjunto conservador: erros do pycodestyle e pyflakes, ordem de imports,
# bugbear e modernizações do pyupgrade.
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",   # 66 linhas passam de 100 colunas; não há formatador adotado, não reescrevemos.
    "E741",   # `l` em compreensões curtas (demo, ablação): legível no contexto.
    "B905",   # zip(strict=True) mudaria o comportamento quando os tamanhos divergem.
    "UP017",  # datetime.timezone.utc -> datetime.UTC é só cosmético; evita churn.
]

[tool.ruff.lint.per-file-ignores]
# Script de ablação com relatório em formato printf; trocar não muda nada útil.
"training/ablacao_sensores.py" = ["UP031"]

[tool.ruff.lint.isort]
known-first-party = ["spyno_service", "spyno_decision", "training"]
