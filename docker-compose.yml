# Traefik e cloudflared já rodam em outro projeto Compose, na rede externa
# `proxy`. Aqui sobem apenas o serviço de decisão e seu Postgres.
services:
  decision:
    build:
      context: .
      args:
        COM_PPO: ${COM_PPO:-0}
    restart: unless-stopped
    environment:
      SPYNO_DB_URL: postgresql+psycopg://spyno:${POSTGRES_PASSWORD:-spyno}@db:5432/spyno_decision
      SPYNO_POLICY: ${SPYNO_POLICY:-ts_hybrid}
      SPYNO_SHADOW: ${SPYNO_SHADOW:-1}
      # Em shadow a posterior fica congelada; 1 faz ela aprender com (x, 0, y) (não validado).
      SPYNO_SHADOW_LEARN: ${SPYNO_SHADOW_LEARN:-0}
      # Sem token o serviço responde 503 em /v1/* (fail closed).
      SPYNO_DECISION_TOKEN: ${SPYNO_DECISION_TOKEN:-}
      SPYNO_CHECKPOINT_DIR: /app/checkpoints
      # Posterior inicial: warm-start sintético do spyno-sim (ts_hybrid, c=0,1).
      # Vazio (SPYNO_WARMSTART_SNAPSHOT=) começa do prior. Trocar SPYNO_POLICY
      # exige trocar ou esvaziar este artefato: incompatível, o serviço não sobe.
      SPYNO_WARMSTART_SNAPSHOT: ${SPYNO_WARMSTART_SNAPSHOT-/app/warmstart/ts_hybrid-v2-c0.1.json}
    volumes:
      - ./checkpoints:/app/checkpoints:ro
    depends_on:
      db:
        condition: service_healthy
    networks: [proxy, internal]
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.spyno-decision.rule=Host(`${SPYNO_DECISION_HOST:-decisao.spyno.app}`)
      - traefik.http.routers.spyno-decision.entrypoints=web
      - traefik.http.services.spyno-decision.loadbalancer.server.port=8000

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: spyno
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spyno}
      POSTGRES_DB: spyno_decision
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spyno -d spyno_decision"]
      interval: 5s
      retries: 10

volumes:
  pgdata:

networks:
  proxy:
    external: true
  internal:
